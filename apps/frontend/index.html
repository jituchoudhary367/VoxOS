<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxOS Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🔊</span>
                <h1>VoxOS</h1>
            </div>
            <nav>
                <ul>
                    <li class="active"><a href="#dashboard" id="nav-dashboard">Dashboard</a></li>
                    <li><a href="#tasks" id="nav-tasks">Tasks</a></li>
                    <li><a href="#approvals" id="nav-approvals">Approvals <span class="badge" id="approval-badge">0</span></a></li>
                    <li><a href="#tools" id="nav-tools">Tools</a></li>
                    <li><a href="#settings" id="nav-settings">Settings</a></li>
                </ul>
            </nav>
            <div class="system-status">
                <div class="status-indicator online"></div>
                <span>System Online</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header>
                <h2>Dashboard</h2>
                <div class="user-profile">
                    <span>Admin User</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <!-- Dashboard View -->
            <div id="view-dashboard" class="view active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Active Tasks</h3>
                        <div class="stat-value" id="stat-active-tasks">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Approvals</h3>
                        <div class="stat-value warning" id="stat-pending-approvals">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Tools Executed</h3>
                        <div class="stat-value" id="stat-tools-executed">0</div>
                    </div>
                </div>

                <div class="split-view">
                    <!-- Chat Interface -->
                    <div class="chat-container card">
                        <div class="card-header">
                            <h3>Agent Chat</h3>
                            <button class="btn btn-icon" id="btn-voice" title="Start Voice Session">🎤</button>
                        </div>
                        <div class="chat-messages" id="chat-messages">
                            <!-- Messages will be injected here -->
                            <div class="message system">VoxOS initialized and ready.</div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Ask VoxOS to do something...">
                            <button id="btn-send" class="btn btn-primary">Send</button>
                        </div>
                    </div>

                    <!-- Recent Tasks -->
                    <div class="tasks-summary card">
                        <div class="card-header">
                            <h3>Recent Tasks</h3>
                            <button class="btn btn-small" id="btn-refresh-tasks">Refresh</button>
                        </div>
                        <ul class="task-list" id="recent-task-list">
                            <!-- Tasks injected here -->
                            <li class="empty-state">No recent tasks</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Approvals View -->
            <div id="view-approvals" class="view">
                <div class="card">
                    <div class="card-header">
                        <h3>Pending Approvals</h3>
                    </div>
                    <div class="approvals-list" id="approvals-list-container">
                        <div class="empty-state">No pending approvals.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
